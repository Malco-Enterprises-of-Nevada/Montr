[package]
name = "montr-client"
version = "1.1.1"
edition = "2021"
authors = ["Montr Contributors"]
description = "Montr media playlist client for automated playback"
license = "MIT"
rust-version = "1.85"

[dependencies]
# Async runtime
tokio = { version = "1.36", features = ["full"] }
tokio-util = "0.7"

# Media playback (mpv controlled via JSON IPC subprocess)

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }

# WebSocket
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# TLS
native-tls = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }

# UUID
uuid = { version = "1.7", features = ["v4", "serde"] }

# Hashing for checksums
sha2 = "0.10"
hex = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry", "fmt"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Paths and filesystem
directories = "5.0"

# Progress bars and indicators
indicatif = "0.17"

# Caching
lru = "0.12"

# System information
sysinfo = "0.30"

# Random number generation (for jitter)
rand = "0.8"
exec = "0.3.1"

# Atomic config snapshot for hot reload (SIGHUP-driven swap of intervals + tunables)
arc-swap = "1"

# Cron expression parser for offline schedule re-evaluation
cron = "0.12"

# Date/time + IANA timezones for schedule windows
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.8"

[target.'cfg(unix)'.dependencies]
# Unix-specific dependencies (if needed)

[dev-dependencies]
mockall = "0.12"
tempfile = "3.9"
mockito = "1.2"
nix = { version = "0.30.1", features = ["signal"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[[bin]]
name = "montr-client"
path = "src/main.rs"
