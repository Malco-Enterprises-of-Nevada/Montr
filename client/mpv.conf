# Default mpv configuration shipped with montr-client. Loaded via
# `--include=/etc/montr-client/mpv.conf` from the playback engine.
#
# This file is a Debian conffile — operator edits survive package upgrades.
# Override anything here by editing this file directly, or by adding the
# same option to ~/.config/mpv/mpv.conf for the user the service runs as
# (cmdline overrides config; user config overrides system config).
#
# Why these defaults:
#
# - vo=gpu : the auto-detected default on Wayland is `dmabuf-wayland`,
#   which silently fails to render on Pi 5 + labwc with software-decoded
#   yuv420p frames ("Could not initialize video chain. Video: no video").
#   Forcing the gpu vo (libplacebo) gets a working pipeline.
#
# - gpu-api=opengl : with the gpu vo, mpv defaults to gpu-api=auto which
#   tries Vulkan first. On Pi 5 the libplacebo Vulkan path hard-fails
#   ("vk->CreateSwapchainKHR(...): VK_ERROR_OUT_OF_HOST_MEMORY") in a
#   tight retry loop, leaving a black fullscreen window. OpenGL via EGL
#   works.
#
# - gpu-context=auto : let mpv pick wayland/x11 based on env. We don't
#   force it because on Xwayland-only sessions or amd64 desktops, the
#   wayland context is wrong.
#
# Operators on amd64 with a working Vulkan stack may want to comment
# out gpu-api=opengl to get hardware-accelerated rendering.

vo=gpu
gpu-api=opengl
gpu-context=auto
