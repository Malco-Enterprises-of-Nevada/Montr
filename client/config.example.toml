[server]
url = "http://192.168.1.100:3000"
api_key = ""
reconnect_interval = 5
heartbeat_interval = 30
# Path to custom CA certificate (PEM) for TLS verification
# ca_cert_path = "/path/to/ca.pem"
# Skip TLS certificate verification (DANGEROUS — dev/testing only)
# tls_skip_verify = false

[client]
id = "de863e20-55ed-4b89-85ed-ac6efa1b9b67"
name = "Client-01"

[playback]
default_image_duration = 5
loop_playlist = true
media_cache_dir = "/home/stripcheese/.cache/montr-client"
max_cache_size_mb = 5000
preload_next_items = 2
# Seconds to wait at startup for the server to assign a playlist before falling
# back to the last-known playlist cached on disk. Set to 0 to disable.
offline_fallback_grace_secs = 5

[system]
auto_start = true
log_level = "info"
log_file = "/home/stripcheese/.local/share/montr-client/logs/client.log"
log_max_size_mb = 100
log_max_files = 5

[display]
fullscreen = true
screen_index = 0

# Subtitle rendering (protocol 1.1.0+). Off by default; set to true to
# display subtitles on videos that advertise them.
enable_subtitles = false

# Preferred subtitle language as an ISO 639-2 code ("eng", "spa", "fra"…).
# When multiple tracks are available, the client picks the one whose
# language matches this, falling back to `is_default` then any track.
# preferred_subtitle_language = "eng"

# Optional mpv `sub-font-size` override. Leave commented to keep mpv's
# default (~55). Useful when the display viewing distance is unusual.
# subtitle_font_size = 65
