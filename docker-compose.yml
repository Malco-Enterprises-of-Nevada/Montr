services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    # Port 3000 is only exposed on the internal docker network; caddy proxies
    # 443 → server:3000. External clients always go through caddy.
    expose:
      - "3000"
    # Container memory ceiling for a 4 GB host: server gets ~2 GB, leaving
    # 2 GB for the OS, disk cache, and any ffmpeg-in-worker RSS that lives
    # in the same cgroup. Without a limit, Node grew until the kernel
    # SIGKILL'd the container — no stack trace, no graceful degradation.
    mem_limit: 2g
    mem_reservation: 1g
    environment:
      # Flip to production: disables verbose error pages, enables view caching,
      # and unlocks a few V8 optimizations. Dev mode inflates heap needlessly.
      NODE_ENV: production
      # Cap V8 old-space below mem_limit so Node throws a catchable
      # ERR_OUT_OF_MEMORY before the kernel SIGKILL hits. 1536 MB heap +
      # ~512 MB headroom for ffmpeg/native allocations stays under 2 GB.
      NODE_OPTIONS: "--max-old-space-size=1536"
      DB_TYPE: sqlite
      DB_PATH: ./data/montr.db
      STORAGE_PATH: ./storage
      API_KEY: ${API_KEY:-}
      API_KEY_REQUIRED: ${API_KEY_REQUIRED:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      LOG_FILE: ${LOG_FILE:-/opt/montr-server/logs/server.log}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-2048}
      CHUNK_SIZE_MB: ${CHUNK_SIZE_MB:-50}
    # unless-stopped: docker will restart the container if it dies (OOM-kill,
    # uncaughtException, crash) but not if we stop it manually via `compose down`.
    restart: unless-stopped
    volumes:
      - server-data:/opt/montr-server/data
      - server-storage:/opt/montr-server/storage
      - server-logs:/opt/montr-server/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: MySQL backend
  # Usage: docker compose --profile mysql up
  mysql:
    image: mysql:8.0
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: montr
      MYSQL_USER: montr
      MYSQL_PASSWORD: montr_dev
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: MongoDB backend
  # Usage: docker compose --profile mongodb up
  mongodb:
    image: mongo:7
    profiles: ["mongodb"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  server-data:
  server-storage:
  server-logs:
  mysql-data:
  mongo-data:
  caddy-data:
  caddy-config:
