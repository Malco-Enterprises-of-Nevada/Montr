name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'docker/server.Dockerfile'
      - 'docker-compose.yml'
      - 'docker/Caddyfile'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, linux]
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # URL-embedded token matches the pattern that worked in
          # provision-server.yml. Pass the fetch URL directly to `git
          # fetch` so nothing with the token gets persisted in
          # .git/config — the remote stays at the clean URL.
          REPO_URL_WITH_TOKEN: https://x-access-token:${{ github.token }}@github.com/Malco-Enterprises-of-Nevada/Montr.git
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          envs: REPO_URL_WITH_TOKEN
          script: |
            set -euo pipefail
            cd /opt/montr
            git fetch "$REPO_URL_WITH_TOKEN" main
            git reset --hard FETCH_HEAD
            docker compose build server
            docker compose up -d
            # Poll /api/health via caddy (self-signed cert → -k). Server is
            # on `expose: 3000` now so hitting localhost:3000 won't work.
            # Give the container up to 90s to boot before giving up.
            for i in $(seq 1 30); do
              sleep 3
              code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/health || true)
              if [ "$code" = "200" ]; then
                echo "Deploy successful! (healthy in ${i}x3s)"
                exit 0
              fi
            done
            echo "Health check failed after 90s. Compose state + logs:"
            docker compose ps
            docker compose logs --tail 50 caddy || true
            docker compose logs --tail 50 server || true
            exit 1
