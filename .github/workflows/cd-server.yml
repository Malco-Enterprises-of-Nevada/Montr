name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'docker/server.Dockerfile'
      - 'docker-compose.yml'

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, linux]
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # URL-embedded token matches the pattern that worked in
          # provision-server.yml. Pass the fetch URL directly to `git
          # fetch` so nothing with the token gets persisted in
          # .git/config — the remote stays at the clean URL.
          REPO_URL_WITH_TOKEN: https://x-access-token:${{ github.token }}@github.com/Malco-Enterprises-of-Nevada/Montr.git
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          envs: REPO_URL_WITH_TOKEN
          script: |
            set -euo pipefail
            cd /opt/montr
            git fetch "$REPO_URL_WITH_TOKEN" main
            git reset --hard FETCH_HEAD
            docker compose build server
            docker compose up -d
            sleep 15
            curl -sf http://localhost:3000/api/health || (echo "Health check failed!" && docker logs montr-server-1 --tail 30 && exit 1)
            echo "Deploy successful!"
