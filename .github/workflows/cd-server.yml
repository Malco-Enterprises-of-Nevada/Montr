name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'docker/server.Dockerfile'
      - 'docker-compose.yml'
      - 'docker/Caddyfile'
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, linux]
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          # URL-embedded token matches the pattern that worked in
          # provision-server.yml. Pass the fetch URL directly to `git
          # fetch` so nothing with the token gets persisted in
          # .git/config — the remote stays at the clean URL.
          REPO_URL_WITH_TOKEN: https://x-access-token:${{ github.token }}@github.com/Malco-Enterprises-of-Nevada/Montr.git
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 20m
          envs: REPO_URL_WITH_TOKEN
          script: |
            set -euo pipefail
            cd /opt/montr
            git fetch "$REPO_URL_WITH_TOKEN" main
            git reset --hard FETCH_HEAD
            docker compose build server
            docker compose up -d
            # Poll Docker's own healthcheck (defined in server.Dockerfile:
            # curl http://localhost:3000/api/health from INSIDE the container).
            # This avoids guessing which virtual host caddy is serving and
            # doesn't depend on the host's network stack.
            for i in $(seq 1 30); do
              sleep 3
              status=$(docker inspect --format='{{.State.Health.Status}}' montr-server-1 2>/dev/null || echo "missing")
              echo "attempt $i: container health=$status"
              if [ "$status" = "healthy" ]; then
                echo "Deploy successful! (healthy in ${i}x3s)"
                exit 0
              fi
            done
            echo "Container did not become healthy after 90s. State + logs:"
            docker compose ps
            docker compose logs --tail 50 caddy || true
            docker compose logs --tail 50 server || true
            exit 1
