name: Provision Server (first-time setup)

# One-shot workflow to bootstrap a freshly rebuilt droplet:
#   1. Install git (docker is already on the marketplace image).
#   2. Clone the repo to /opt/montr.
#   3. Write /opt/montr/.env from GitHub secrets.
#   4. docker compose up -d.
#   5. Wait for /api/health to return 200.
#
# After the first successful run, cd-server.yml handles all subsequent
# deploys. This workflow is only for initial bring-up or disaster recovery.

on:
  workflow_dispatch:

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  provision:
    name: Provision fresh droplet
    runs-on: [self-hosted, linux]
    steps:
      - name: SSH bootstrap
        uses: appleboy/ssh-action@v1
        env:
          # Forwarded into the remote shell via `envs:` so we can auth `git
          # clone` against a private repo without baking a long-lived PAT
          # into .git/config. This is the workflow's ephemeral token, valid
          # only for the duration of this run.
          GH_TOKEN: ${{ github.token }}
          REPO_URL_WITH_TOKEN: https://x-access-token:${{ github.token }}@github.com/Malco-Enterprises-of-Nevada/Montr.git
          REPO_URL_CLEAN: https://github.com/Malco-Enterprises-of-Nevada/Montr.git
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 15m
          envs: GH_TOKEN,REPO_URL_WITH_TOKEN,REPO_URL_CLEAN
          script: |
            set -euo pipefail

            echo "=== uname + disk ==="
            uname -a
            df -h /

            echo "=== ensure git + curl ==="
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq git curl

            echo "=== docker version ==="
            docker --version
            docker compose version

            echo "=== clone or refresh repo at /opt/montr ==="
            if [ ! -d /opt/montr/.git ]; then
              mkdir -p /opt
              git clone "$REPO_URL_WITH_TOKEN" /opt/montr
              cd /opt/montr && git remote set-url origin "$REPO_URL_CLEAN"
            else
              cd /opt/montr
              # Pass the token-bearing URL straight to fetch so it never
              # lands in .git/config. Matches cd-server.yml.
              git fetch "$REPO_URL_WITH_TOKEN" main
              git reset --hard FETCH_HEAD
            fi

            echo "=== write /opt/montr/.env from secrets ==="
            # chmod 600 so the file isn't world-readable. Secrets are written
            # via stdin heredoc so they never appear in process args.
            umask 077
            cat > /opt/montr/.env <<EOF
            API_KEY=${{ secrets.MONTR_API_KEY }}
            API_KEY_REQUIRED=true
            JWT_SECRET=${{ secrets.MONTR_JWT_SECRET }}
            STORAGE_BACKEND=spaces
            SPACES_ENDPOINT=https://sfo3.digitaloceanspaces.com
            SPACES_REGION=sfo3
            SPACES_BUCKET=montr-media
            SPACES_ACCESS_KEY_ID=${{ secrets.SPACES_ACCESS_KEY_ID }}
            SPACES_SECRET_ACCESS_KEY=${{ secrets.SPACES_SECRET_ACCESS_KEY }}
            SPACES_CDN_ENDPOINT=${{ secrets.SPACES_CDN_ENDPOINT }}
            LOG_FILE=/opt/montr-server/logs/server.log
            LOG_LEVEL=info
            MAX_UPLOAD_SIZE_MB=10240
            CHUNK_SIZE_MB=50
            EOF
            chmod 600 /opt/montr/.env
            echo "Wrote /opt/montr/.env ($(wc -l </opt/montr/.env) lines, perms $(stat -c%a /opt/montr/.env))"

            echo "=== docker compose build + up ==="
            cd /opt/montr
            docker compose build server
            docker compose up -d

            echo "=== docker compose ps ==="
            docker compose ps

            echo "=== wait for /api/health via caddy (up to 90s) ==="
            # Server is no longer exposed on host port 3000; it's on the
            # internal docker network behind caddy (which terminates TLS
            # with a self-signed cert, so we use -k).
            for i in $(seq 1 30); do
              sleep 3
              code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/health || true)
              echo "attempt $i: HTTP $code"
              if [ "$code" = "200" ]; then
                echo "Server is healthy."
                echo "=== caddy listener check ==="
                ss -tlnp 2>/dev/null | grep -E ':80|:443' || true
                exit 0
              fi
            done
            echo "Server did not become healthy; showing diagnostics:"
            docker compose ps
            echo "--- caddy logs ---"
            docker compose logs --tail 50 caddy || true
            echo "--- server logs ---"
            docker compose logs --tail 50 server || true
            exit 1
