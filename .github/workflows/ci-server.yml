name: Server CI

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'docker/server.Dockerfile'
      - '.github/workflows/ci-server.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/ci-server.yml'

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint, Format, Typecheck
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Test
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx jest --forceExit tests/unit

  integration-test:
    name: Integration Tests
    runs-on: [self-hosted, linux]
    needs: [lint-and-format]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx jest --forceExit --testTimeout=30000 src/websocket/__tests__/integration.test.ts
