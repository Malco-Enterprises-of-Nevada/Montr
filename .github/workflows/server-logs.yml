name: Server Logs

on:
  workflow_dispatch:
    inputs:
      lines:
        description: 'Number of log lines to fetch'
        required: false
        default: '500'
      restart:
        description: 'Also `docker compose up -d` to restart the container'
        type: boolean
        required: false
        default: false
      cleanup:
        description: 'Clean orphan temp files + docker system prune (safe; 60m age gate)'
        type: boolean
        required: false
        default: false

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  logs:
    name: Fetch server logs
    runs-on: [self-hosted, linux]
    steps:
      - name: Tail docker logs via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "=== docker ps ==="
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' | grep -i montr || true
            echo
            echo "=== docker inspect (state) ==="
            docker inspect --format '{{.State.Status}} exitCode={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} startedAt={{.State.StartedAt}} finishedAt={{.State.FinishedAt}}' montr-server-1 || true
            echo
            if [ "${{ inputs.cleanup }}" = "true" ]; then
              echo "=== disk BEFORE cleanup ==="
              df -h / 2>/dev/null || true
              docker exec montr-server-1 df -h /opt/montr-server 2>/dev/null || true
              echo
              echo "=== purging storage/temp files older than 60m ==="
              # Container's internal temp dir: mapped to the server-storage
              # volume, used by downloadToTemp + chunked upload completes.
              docker exec montr-server-1 find /opt/montr-server/storage/temp \
                -type f -mmin +60 -print -delete 2>/dev/null || true
              echo
              echo "=== docker system prune (unused images/networks; keeps volumes) ==="
              docker system prune -f 2>/dev/null || true
              echo
              echo "=== disk AFTER cleanup ==="
              df -h / 2>/dev/null || true
              docker exec montr-server-1 df -h /opt/montr-server 2>/dev/null || true
              echo
            fi
            if [ "${{ inputs.restart }}" = "true" ]; then
              echo "=== restarting container ==="
              cd /opt/montr && docker compose up -d
              sleep 8
              echo
            fi
            echo "=== docker logs --tail ${{ inputs.lines }} (server) ==="
            docker logs --tail ${{ inputs.lines }} montr-server-1 2>&1 || true
            echo
            echo "=== docker logs --tail 100 (caddy) ==="
            docker logs --tail 100 montr-caddy-1 2>&1 | tail -100 || true
            echo
            echo "=== curl health ==="
            curl -s -o /dev/null -w 'HTTP %{http_code}\n' http://localhost:3000/api/health || true
