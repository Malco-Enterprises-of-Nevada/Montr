name: Release

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/**'
      - 'docker/**'
      - 'deploy/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      force_version:
        description: 'Force a specific version (e.g. 1.2.0). Leave empty for auto-bump.'
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Auto-tag from conventional commits ──────────────────────
  tag:
    name: Auto-Tag
    runs-on: [self-hosted, linux]
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      skipped: ${{ steps.version.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          # Get the latest semver tag (ignore non-semver tags like 'latest')
          LATEST_TAG=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -1)
          LATEST_TAG="${LATEST_TAG:-v0.0.0}"
          echo "Latest tag: $LATEST_TAG"

          # Force version override
          if [ -n "${{ inputs.force_version }}" ]; then
            NEW_VERSION="${{ inputs.force_version }}"
            echo "Forced version: $NEW_VERSION"
            echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Parse current version
          CURRENT="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          # Analyze commits since last tag
          if [ "$LATEST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --oneline --pretty=format:"%s")
          else
            COMMITS=$(git log "${LATEST_TAG}..HEAD" --oneline --pretty=format:"%s")
          fi

          if [ -z "$COMMITS" ]; then
            echo "No new commits since $LATEST_TAG — skipping release"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Determine bump type from conventional commits
          BUMP="patch"
          if echo "$COMMITS" | grep -qiE "^(feat|feature)(\(.+\))?!:|BREAKING CHANGE"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qiE "^(feat|feature)(\(.+\))?:"; then
            BUMP="minor"
          elif echo "$COMMITS" | grep -qiE "^(fix|perf|refactor)(\(.+\))?:"; then
            BUMP="patch"
          fi

          # Apply bump
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "Bump: $BUMP → v$NEW_VERSION"

          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.version.outputs.skipped != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

  # ── Validate ────────────────────────────────────────────────
  validate:
    name: Validate
    needs: tag
    if: needs.tag.outputs.skipped != 'true'
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      # Server validation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: server
      - run: npm run format:check
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npx jest --forceExit tests/unit
        working-directory: server

      # Client validation
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
        working-directory: client
      - run: cargo clippy -- -D warnings
        working-directory: client
      - run: cargo test
        working-directory: client

  # ── Build Server ────────────────────────────────────────────
  build-server:
    name: Build Server
    needs: [tag, validate]
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --legacy-peer-deps && npm run build
        working-directory: server
      - name: Create server tarball
        run: tar -czf montr-server-${{ needs.tag.outputs.tag }}.tar.gz -C server dist package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: montr-server-${{ needs.tag.outputs.tag }}
          path: montr-server-${{ needs.tag.outputs.tag }}.tar.gz

  # ── Build Server .deb ───────────────────────────────────────
  build-deb-server:
    name: Build Server (.deb)
    needs: [tag, validate]
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --legacy-peer-deps && npm run build
        working-directory: server
      - run: npm ci --omit=dev --legacy-peer-deps
        working-directory: server
      - name: Build .deb package
        run: scripts/packaging/build-deb.sh server
      - uses: actions/upload-artifact@v4
        with:
          name: montr-server-deb
          path: build/montr-server_*.deb

  # ── Build Client (Linux) ───────────────────────────────────
  build-client-linux:
    name: Build Client (Linux)
    needs: [tag, validate]
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Build via Docker
        run: >
          DOCKER_BUILDKIT=1 docker build
          -f docker/client.Dockerfile
          --build-arg BUILD_SHA=${{ github.sha }}
          --target binary-export
          --output type=local,dest=build/client .
      - name: Rename and checksum
        run: |
          cd build/client
          mv montr-client montr-client-linux-amd64
          sha256sum montr-client-linux-amd64 > montr-client-linux-amd64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: montr-client-linux-amd64
          path: |
            build/client/montr-client-linux-amd64
            build/client/montr-client-linux-amd64.sha256

  # ── Build Client (Linux arm64) ─────────────────────────────
  build-client-linux-arm64:
    name: Build Client (Linux arm64)
    needs: [tag, validate]
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build via Docker
        run: >
          docker buildx build
          -f docker/client.Dockerfile
          --platform linux/arm64
          --build-arg BUILD_SHA=${{ github.sha }}
          --target binary-export
          --output type=local,dest=build/client .
      - name: Rename and checksum
        run: |
          cd build/client
          mv montr-client montr-client-linux-arm64
          sha256sum montr-client-linux-arm64 > montr-client-linux-arm64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: montr-client-linux-arm64
          path: |
            build/client/montr-client-linux-arm64
            build/client/montr-client-linux-arm64.sha256

  # ── Build Client (macOS) ──────────────────────────────────
  # Runs on the self-hosted Apple Silicon Mac (mac-monrose-arm64). Both
  # matrix entries dispatch to the same runner: arm64 builds natively,
  # x86_64 cross-compiles via the rustup target installed by
  # dtolnay/rust-toolchain. The host SDK on Apple Silicon includes the
  # x86_64 slice so no extra toolchain setup is needed.
  build-client-macos:
    name: Build Client (macOS)
    needs: [tag, validate]
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: montr-client-darwin-arm64
          - target: x86_64-apple-darwin
            artifact: montr-client-darwin-amd64
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        working-directory: client
        env:
          BUILD_SHA: ${{ github.sha }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename and checksum
        run: |
          mkdir -p build/client
          cp client/target/${{ matrix.target }}/release/montr-client build/client/${{ matrix.artifact }}
          cd build/client
          shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/client/${{ matrix.artifact }}
            build/client/${{ matrix.artifact }}.sha256

  # ── Build Client .deb ───────────────────────────────────────
  build-deb-client:
    name: Build Client (.deb)
    needs: [tag, build-client-linux]
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: montr-client-linux-amd64
          path: build/client
      - name: Prepare binary for packaging
        run: |
          cp build/client/montr-client-linux-amd64 build/client/montr-client
          chmod +x build/client/montr-client
      - name: Build .deb package
        run: scripts/packaging/build-deb.sh client
      - uses: actions/upload-artifact@v4
        with:
          name: montr-client-deb
          path: build/montr-client_*.deb

  # ── Create GitHub Release ───────────────────────────────────
  create-release:
    name: Create Release
    needs:
      - tag
      - build-server
      - build-deb-server
      - build-client-linux
      - build-client-linux-arm64
      - build-client-macos
      - build-deb-client
    runs-on: [self-hosted, linux]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
          else
            RANGE="${TAG}"
          fi

          {
            echo "NOTES<<EOF"
            echo "Automated build from commit ${{ github.sha }}"
            echo ""
            echo "## What's Changed"
            echo ""
            echo "### Features"
            git log "$RANGE" --oneline --pretty=format:"- %s" | grep -E "^- feat(\(.+\))?:" || echo "- _(none)_"
            echo ""
            echo ""
            echo "### Bug Fixes"
            git log "$RANGE" --oneline --pretty=format:"- %s" | grep -E "^- fix(\(.+\))?:" || echo "- _(none)_"
            echo ""
            echo ""
            echo "### Other"
            git log "$RANGE" --oneline --pretty=format:"- %s" | grep -vE "^- (feat|fix)(\(.+\))?:" || echo "- _(none)_"
            echo ""
            echo ""
            echo "## Downloads"
            echo ""
            echo "| Platform | File |"
            echo "|----------|------|"
            echo "| Linux x86_64 | \`montr-client-linux-amd64\` |"
            echo "| Linux arm64 | \`montr-client-linux-arm64\` |"
            echo "| macOS Apple Silicon | \`montr-client-darwin-arm64\` |"
            echo "| macOS Intel | \`montr-client-darwin-amd64\` |"
            echo "| Linux (Debian) | \`montr-server_*.deb\`, \`montr-client_*.deb\` |"
            echo "| Server (all platforms) | \`montr-server-${TAG}.tar.gz\` |"
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: Montr ${{ needs.tag.outputs.tag }}
          body: ${{ steps.notes.outputs.NOTES }}
          prerelease: false
          files: |
            artifacts/montr-server-${{ needs.tag.outputs.tag }}/*.tar.gz
            artifacts/montr-client-linux-amd64/montr-client-linux-amd64
            artifacts/montr-client-linux-amd64/montr-client-linux-amd64.sha256
            artifacts/montr-client-linux-arm64/montr-client-linux-arm64
            artifacts/montr-client-linux-arm64/montr-client-linux-arm64.sha256
            artifacts/montr-client-darwin-arm64/montr-client-darwin-arm64
            artifacts/montr-client-darwin-arm64/montr-client-darwin-arm64.sha256
            artifacts/montr-client-darwin-amd64/montr-client-darwin-amd64
            artifacts/montr-client-darwin-amd64/montr-client-darwin-amd64.sha256
            artifacts/montr-server-deb/*.deb
            artifacts/montr-client-deb/*.deb

  # ── Upload Client Binaries to Spaces ───────────────────────
  upload-to-spaces:
    name: Upload to Spaces
    needs:
      - tag
      - build-client-linux
      - build-client-linux-arm64
      - build-client-macos
    runs-on: [self-hosted, linux]
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      SPACES_ENDPOINT: https://sfo3.digitaloceanspaces.com
      SPACES_BUCKET: montr-media
      BASE_URL: https://montr-media.sfo3.digitaloceanspaces.com/releases
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload binaries to Spaces
        run: |
          for file in \
            artifacts/montr-client-linux-amd64/montr-client-linux-amd64 \
            artifacts/montr-client-linux-amd64/montr-client-linux-amd64.sha256 \
            artifacts/montr-client-linux-arm64/montr-client-linux-arm64 \
            artifacts/montr-client-linux-arm64/montr-client-linux-arm64.sha256 \
            artifacts/montr-client-darwin-arm64/montr-client-darwin-arm64 \
            artifacts/montr-client-darwin-arm64/montr-client-darwin-arm64.sha256 \
            artifacts/montr-client-darwin-amd64/montr-client-darwin-amd64 \
            artifacts/montr-client-darwin-amd64/montr-client-darwin-amd64.sha256; do
            name=$(basename "$file")
            echo "Uploading $name..."
            aws s3 cp "$file" "s3://${SPACES_BUCKET}/releases/${name}" \
              --endpoint-url "${SPACES_ENDPOINT}" \
              --acl public-read
          done

      - name: Generate and upload latest.json manifest
        run: |
          cat > latest.json <<MANIFEST
          {
            "version": "${{ needs.tag.outputs.tag }}",
            "commit": "${{ github.sha }}",
            "assets": {
              "montr-client-linux-amd64": "${BASE_URL}/montr-client-linux-amd64",
              "montr-client-linux-amd64.sha256": "${BASE_URL}/montr-client-linux-amd64.sha256",
              "montr-client-linux-arm64": "${BASE_URL}/montr-client-linux-arm64",
              "montr-client-linux-arm64.sha256": "${BASE_URL}/montr-client-linux-arm64.sha256",
              "montr-client-darwin-arm64": "${BASE_URL}/montr-client-darwin-arm64",
              "montr-client-darwin-arm64.sha256": "${BASE_URL}/montr-client-darwin-arm64.sha256",
              "montr-client-darwin-amd64": "${BASE_URL}/montr-client-darwin-amd64",
              "montr-client-darwin-amd64.sha256": "${BASE_URL}/montr-client-darwin-amd64.sha256"
            }
          }
          MANIFEST
          aws s3 cp latest.json "s3://${SPACES_BUCKET}/releases/latest.json" \
            --endpoint-url "${SPACES_ENDPOINT}" \
            --acl public-read \
            --content-type "application/json"
