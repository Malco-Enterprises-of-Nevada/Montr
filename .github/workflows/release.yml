name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Server validation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run lint
        working-directory: server
      - run: npm run format:check
        working-directory: server
      - run: npm run typecheck
        working-directory: server
      - run: npm run test:coverage
        working-directory: server

      # Client validation
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.75'
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libmpv-dev
      - run: cargo fmt --check
        working-directory: client
      - run: cargo clippy -- -D warnings
        working-directory: client
      - run: cargo test
        working-directory: client

  build-server:
    name: Build Server
    needs: validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci && npm run build
      - run: tar -czf montr-server-${{ github.ref_name }}.tar.gz -C server dist package.json package-lock.json
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: montr-server-${{ github.ref_name }}
          path: montr-server-${{ github.ref_name }}.tar.gz

  build-client-linux:
    name: Build Client (Linux)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: DOCKER_BUILDKIT=1 docker build -f docker/client.Dockerfile --target binary-export --output type=local,dest=build/client .
      - uses: actions/upload-artifact@v4
        with:
          name: montr-client-linux-amd64
          path: build/client/montr-client

  create-release:
    name: Create Release
    needs: [build-server, build-client-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            RANGE="$PREV_TAG..HEAD"
          else
            RANGE="HEAD"
          fi
          {
            echo "NOTES<<EOF"
            echo "## Changes"
            echo ""
            git log "$RANGE" --oneline --pretty=format:"- %s" | grep -E "^- (feat|fix|refactor|perf):" || true
            echo ""
            echo ""
            echo "## Other"
            echo ""
            git log "$RANGE" --oneline --pretty=format:"- %s" | grep -vE "^- (feat|fix|refactor|perf):" || true
            echo ""
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: Montr ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.NOTES }}
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            artifacts/montr-server-${{ github.ref_name }}/*.tar.gz
            artifacts/montr-client-linux-amd64/montr-client
